services:
  postgres:
    image: postgres:16
    container_name: hw12-postgres
    restart: always
    environment:
      POSTGRES_DB: contacts_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_hw12_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: hw12-redis
    restart: always
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: hw12-fastapi
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app

volumes:
  postgres_hw12_data:
